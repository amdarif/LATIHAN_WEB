<!DOCTYPE html>
<html>  
    <head>
        <title>Latihan Web02</title>
        
        <style>
            .atur-kotak-label{
            width: 200px;
            border: 2px solid #808080;
            }   

            .atur-kotak-luar{ 
            width: 300px;          
            height: 200px;        
            border: 2px solid #808080; 
            
            padding: 15px;
            background-color: #f0f0f0;
            margin: 250px auto; 
            }

            .panahscroll{
            overflow-y: scroll;    
            overflow-x: hidden; 

            }

        </style>

    </head>
    <body>
        <div class="atur-kotak-luar panahscroll">
            <form>  
                <table> 
                    <tr>
                        <td>
                            <label>Name</label>
                        </td>
                        <td>
                            <label>:</label>
                        </td>
                        <td>
                            <input class="atur-kotak-label" type="text" name="Name" placeholder="your name here">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Email</label>
                        </td>
                        <td>
                            :
                        </td>
                        <td>
                            <input  class="atur-kotak-label" name="Email" placeholder="your email here">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Address</label>
                        </td>
                        <td>
                            :
                        </td>
                        <td>
                        <textarea class="panahscroll atur-kotak-label" name="Address" rows="4"  placeholder="25 Nowhere Street&#10;Somewhere&#10;Not Here&#10;Y2K 5RU"></textarea>
                        </td>
                    </tr>
                      <tr>
                        <td>
                            <label>Postcode</label>
                        </td>
                        <td>
                            :
                        </td>
                        <td>
                            <input  class="atur-kotak-label" name="Postcode" placeholder="postal code">
                        </td>
                    </tr>
                </table>
            </form>
        </div> 
    </body>
</html>
