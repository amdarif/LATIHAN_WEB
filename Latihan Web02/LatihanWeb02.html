<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web02</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container{
            width: 600px;
            height: 350px;
            margin: 50px auto;
            border: 2px solid #999;
            background: #fff;
            padding: 20px;
            overflow-y: scroll;
        }

        .form-group{
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        label{
            width: 90px;
            font-size: 18px;
        }

        input[type="text"],
        input[type="email"]{
            width: 380px;
            padding: 5px;
            font-size: 16px;
        }

        textarea{
            width: 320px;
            height: 120px;
            padding: 5px;
            font-size: 16px;
            resize: none;
        }

        .postcode{
            width: 220px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <form>
            <div class="form-group">
                <label>Name:</label>
                <input type="text" placeholder="your name here">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" placeholder="your email here">
            </div>

            <div class="form-group">
                <label>Address:</label>
                <textarea>25 Nowhere Street
Somewhere
Not Here
Y2K 5RU</textarea>
            </div>

            <div class="form-group">
                <label>Postcode:</label>
                <input type="text" class="postcode" placeholder="postal code">
            </div>
        </form>
    </div>

</body>
</html>
