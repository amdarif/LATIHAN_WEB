<!DOCTYPE html>
<html>
  <head>
    <title>Latihan To-Do-List</title>
  </head>

  <body>
      <h1>Latihan Java script 2</h1>
      <h2>To-Do List</h2>

      <input id="kegiatan" placeholder="Kegiatan Baru">

      <button onclick="tbh_kgt()">Tambah</button>

      <ul id="list"></ul>

      <button onclick="Bersihkan()">Bersihkan</button>

      <script>

          let kegiatan = [];

          function tmpl_kgt() 
          {
            let html = "";
            for (let i = 0; i < kegiatan.length; i++) 
            {
              html += "<li>" + kegiatan[i] +  " <button onclick='hps_kgt(" + i + ")';> x</button></li>";
            }
            document.getElementById("list").innerHTML = html;
          }


          function tbh_kgt() 
          {
            let inpt_kgt = document.getElementById("kegiatan");
            let text = inpt_kgt.value;
            if (text === "") 
              {
                return;
              }
            kegiatan.push(text);
            inpt_kgt.value = "";
            smpn_kgt();
            tmpl_kgt();
          }


          function hps_kgt(i) 
          {
            kegiatan.splice(i, 1);
            smpn_kgt();
            tmpl_kgt();
          }


          function Bersihkan() 
          {
            kegiatan = [];
            smpn_kgt();
            tmpl_kgt();
          }


          function smpn_kgt() 
          {
            localStorage.setItem("kegiatan", JSON.stringify(kegiatan));
          }


          function muat_kgt() 
          {
            let simpan = localStorage.getItem("kegiatan");
            if (simpan !== null) 
            {
              kegiatan = JSON.parse(simpan);
            }
          }
          muat_kgt();
          tmpl_kgt();

      </script>

  </body>
</html>
