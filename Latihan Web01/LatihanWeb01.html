<!DOCTYPE html>
<html>
<head>
    <title>Latihan Web01</title>

    <style>
        table {
            width: 520px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid rgb(0, 0, 0);
        }

        .header {
            height: 60px;
            background-color: #b36f30;
            text-align: center;
        }

        .navigasi {
            height: 40px;
            background-color: #7990b3;
            text-align: center;
        }

        .konten {
            width: 400px;
            height: 220px;
            background-color: #963333;
            padding: 20px 40px;
            vertical-align: top;
        }

        .menu {
            width: 120px;
            background-color: #487239;
            vertical-align: middle;
        }

        .footer {
            height: 40px;
            background-color: #b6906c;
            text-align: center;
        }
    </style>
</head>

<body>

    <table>

        <!-- HEADER -->
        <tr>
            <td colspan="2" class="header">

                <header>
                    HEADER
                </header>

            </td>
        </tr>


        <!-- NAVIGASI -->
        <tr>
            <td colspan="2" class="navigasi">

                <nav>
                    NAVIGASI
                </nav>

            </td>
        </tr>


        <!-- KONTEN DAN MENU -->
        <tr>

            <!-- KONTEN UTAMA -->
            <td class="konten">

                <main>

                    <h1>Heading 1</h1>

                    <p>
                        Lorem ipsum dolor sit amet, consectetur
                        adipisicing elit, sed do eiusmod tempor
                        incididunt ut labore et dolore magna aliqua.
                    </p>

                </main>

            </td>


            <!-- MENU -->
            <td class="menu">

                <aside>

                    <b>Menu:</b>

                    <ul>
                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>

                </aside>

            </td>

        </tr>


        <!-- FOOTER -->
        <tr>
            <td colspan="2" class="footer">

                <footer>
                    FOOTER
                </footer>

            </td>
        </tr>

    </table>

</body>
</html>
